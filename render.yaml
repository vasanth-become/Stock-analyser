# ─────────────────────────────────────────────────────────────────────────────
# Render.com Infrastructure-as-Code
# Deploy with: https://dashboard.render.com/select-repo
# Docs: https://render.com/docs/infrastructure-as-code
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Web Application ─────────────────────────────────────────────────────────
  - type: web
    name: stockanalyser
    runtime: node
    plan: starter          # $7/month — upgrade to standard for production
    region: singapore      # Closest to Indian users
    branch: main

    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start

    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: stockanalyser-db
          property: connectionString
      - key: NEXTAUTH_URL
        sync: false          # Set manually in Render dashboard
      - key: NEXTAUTH_SECRET
        generateValue: true  # Render auto-generates a secure secret
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_PLAN_MONTHLY
        sync: false
      - key: RAZORPAY_PLAN_YEARLY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: MONTHLY_SPEND_LIMIT
        value: '50'
      - key: CRON_SECRET
        generateValue: true
      - key: SENTRY_DSN
        sync: false
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false

    autoDeploy: true

  # ── Cron Jobs (Render native cron — replaces node-cron in serverless) ───────
  - type: cron
    name: stockanalyser-market-refresh
    runtime: node
    plan: starter
    schedule: '*/15 3-11 * * 1-5'    # Every 15 min, Mon–Fri, 08:30–17:00 IST
    buildCommand: npm ci
    startCommand: >
      curl -s -H "Authorization: Bearer $CRON_SECRET"
      $NEXTAUTH_URL/api/cron/refresh
    envVars:
      - key: CRON_SECRET
        fromService:
          name: stockanalyser
          type: web
          envVarKey: CRON_SECRET
      - key: NEXTAUTH_URL
        fromService:
          name: stockanalyser
          type: web
          envVarKey: NEXTAUTH_URL

  - type: cron
    name: stockanalyser-digest
    runtime: node
    plan: starter
    schedule: '30 2 * * 1'           # Monday 08:00 IST (02:30 UTC)
    buildCommand: npm ci
    startCommand: >
      curl -s -H "Authorization: Bearer $CRON_SECRET"
      $NEXTAUTH_URL/api/cron/digest
    envVars:
      - key: CRON_SECRET
        fromService:
          name: stockanalyser
          type: web
          envVarKey: CRON_SECRET
      - key: NEXTAUTH_URL
        fromService:
          name: stockanalyser
          type: web
          envVarKey: NEXTAUTH_URL

# ── Managed PostgreSQL ─────────────────────────────────────────────────────────
databases:
  - name: stockanalyser-db
    plan: free             # 1 GB storage — upgrade to starter ($7/mo) for production
    databaseName: stockanalyser
    user: stockanalyser
    region: singapore
